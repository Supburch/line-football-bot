name: Update Thai Stock Prices

on:
  schedule:
    # 17:10 Thailand time (UTC+7), Monday through Friday.
    - cron: "10 10 * * 1-5"
  workflow_dispatch:

jobs:
  update-stock-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run stock update script
        env:
          GOOGLE_SHEETS_CREDS: ${{ secrets.GOOGLE_SHEETS_CREDS }}
        run: python update_stock.py
